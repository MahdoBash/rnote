---

name: Build Windows Installer

"on":
  push:
    branches: [codex/page-indicator, codex/page-navigation]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    permissions:
      # needed for uploading release artifact
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install Inno 6
        id: install_inno
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\") {
            echo "inno already installed"
          } else {
            winget install -e --id JRSoftware.InnoSetup -v 6.4.3 --accept-package-agreements `
              --accept-source-agreements --disable-interactivity --scope machine
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\") {
              echo "inno installed successfully"
            } else {
              throw "could not find inno's installation folder"
            }
          }

      - name: Set installer name
        id: set_installer_name
        shell: bash
        run: |
          echo "name=rnote-win-installer-$(echo ${GITHUB_REF_NAME#v} \
            | sed -e 's/[^A-Za-z0-9._-]/_/g')-x86_64" >> $GITHUB_OUTPUT

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          release: false
          update: true
          msystem: UCRT64
          install: |
            just

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99-gnu

      - name: Configure PATH
        run: echo "export PATH=$PATH:/c/Users/$USER/.cargo/bin:/c/Program\ Files\ \(x86\)/Inno\ Setup\ 6" > ~/.bashrc

      - name: Checkout
        uses: actions/checkout@v6

      - name: Test page indicator calculations
        run: |
          rustc --edition 2024 --test build-aux/page-indicator-tests.rs -o page-indicator-tests.exe
          ./page-indicator-tests.exe
          rustc --edition 2024 --test build-aux/touch-motion-tests.rs -o touch-motion-tests.exe
          ./touch-motion-tests.exe

      - name: Prerequisites
        run: |
          just ci=true prerequisites-win

      - name: Setup
        run: just ci=true setup-win-installer '${{ steps.set_installer_name.outputs.name }}'

      - name: Build
        run: just ci=true build

      - name: Build installer
        run: just ci=true build-win-installer

      - name: Smoke test installed application
        shell: pwsh
        run: |
          $installer = Resolve-Path "_mesonbuild/${{ steps.set_installer_name.outputs.name }}.exe"
          $installation = Join-Path $env:RUNNER_TEMP "RnoteSmoke"
          $setup = Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installation" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          # Hosted runners have no supported GPU; exercise startup with Cairo.
          $env:GSK_RENDERER = "cairo"
          $app = Start-Process "$installation/bin/rnote.exe" -PassThru -RedirectStandardError "$env:RUNNER_TEMP/rnote-stderr.txt"
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) {
            Get-Content "$env:RUNNER_TEMP/rnote-stderr.txt"
            throw "Application exited during startup: $($app.ExitCode)"
          }
          if ($app.MainWindowHandle -eq 0) { throw "Application did not open a window" }
          ./build-aux/check-window-region.ps1 -WindowHandle $app.MainWindowHandle
          Stop-Process -Id $app.Id
          $errors = Get-Content "$env:RUNNER_TEMP/rnote-stderr.txt" -Raw
          if ($errors -match "(CRITICAL|panicked|Failed to build template)") { throw $errors }

      - name: Upload installer (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: rnote-win-installer-artifact
          path: _mesonbuild/${{ steps.set_installer_name.outputs.name }}.exe
          if-no-files-found: error

      - name: Upload installer (release asset)
        if: ${{ github.event_name == 'release' }}
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} _mesonbuild/${{ steps.set_installer_name.outputs.name }}.exe
